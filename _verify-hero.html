<!doctype html>
<meta charset="utf-8">
<title>verify hero</title>
<style>body{background:#111;color:#ddd;font:13px/1.5 monospace;padding:12px}
.ok{color:#8ad67a}.bad{color:#ff7a6b}.hd{color:#e0b07a;margin-top:10px}
iframe{border:1px solid #333}</style>
<pre id="out">running…</pre>
<iframe id="f" style="width:1280px;height:900px"></iframe>
<script>
/* A throwaway harness for the hero: the four pills, the line of description
   each one carries, and the connectors tying them to the name. Not shipped.

   The three things it is here to hold down, because all three are the kind
   that look right in a screenshot and are wrong in use:

   · One pill at a time. Four descriptions on screen at once is the state
     this replaced, and the easiest one to fall back into.
   · Nothing moves when a pill is pointed at. The description's box is
     reserved from the first frame; if it ever starts taking its own space,
     the pill under the pointer shifts at the moment it is hovered and the
     connector measured against it goes stale.
   · Every connector has two ends that are on something — its own pill at
     the top, the ink of its letter at the bottom — and crosses neither the
     other pills nor the greeting on the way. */
const lines = [];
let pass = 0, fail = 0;
function head(t){ lines.push('\n<span class="hd">'+t+'</span>'); }
function check(name, cond, extra){
  if (cond) { pass++; lines.push('<span class="ok">  PASS</span> '+name); }
  else { fail++; lines.push('<span class="bad">  FAIL</span> '+name+(extra!==undefined?'  ['+extra+']':'')); }
}
function flush(){
  document.getElementById('out').innerHTML =
    lines.join('\n') + '\n\n<span class="hd">RESULT</span> pass='+pass+' fail='+fail+
    (fail? ' <span class="bad">***FAILURES***</span>' : ' <span class="ok">ALL GREEN</span>');
}
const errors = [];
const wait = ms => new Promise(r => setTimeout(r, ms));
const f = document.getElementById('f');

function post(){
  const txt = lines.join('\n').replace(/<[^>]+>/g, '') +
    '\n\nRESULT pass=' + pass + ' fail=' + fail + (fail ? '  ***FAILURES***' : '  ALL GREEN');
  navigator.sendBeacon('/report', txt) || fetch('/report', { method:'POST', body: txt });
}

function overflowing(w){
  const d = w.document, lim = d.documentElement.clientWidth, out = [];
  d.querySelectorAll('*').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.width === 0 && r.height === 0) return;
    if (r.right > lim + 0.5 || r.left < -0.5) {
      out.push(el.tagName.toLowerCase() +
        (el.className && typeof el.className === 'string' ? '.' + el.className.trim().split(/\s+/).join('.') : '') +
        ' [' + Math.round(r.left) + '→' + Math.round(r.right) + ']');
    }
  });
  return out.slice(0, 8).join('  ');
}

/* The iframe's load event fires for the initial about:blank too, and a cold
   start can hand over a document whose scripts have not run — which reads
   back as "there are no connectors", which is not true of the page. */
function load(url, w, h){
  f.style.width = w + 'px';
  f.style.height = h + 'px';
  return new Promise((res, rej) => {
    f.src = url;
    const t0 = Date.now();
    const poll = setInterval(() => {
      let cw = null;
      try {
        cw = f.contentWindow;
        if (cw && cw.location.href.indexOf(url) !== -1 &&
            cw.document.readyState !== 'loading' &&
            cw.APTokens && cw.document.querySelector('.wm__script')) {
          clearInterval(poll); res(cw); return;
        }
      } catch (e) {}
      if (Date.now() - t0 > 20000) { clearInterval(poll); rej(new Error('timed out loading ' + url)); }
    }, 100);
  });
}

/* ---- geometry helpers --------------------------------------------------
   The connector layer is an SVG with a viewBox the same size in user units
   as the canvas it covers, so a path coordinate is a canvas pixel. Parsing
   the paths back out is the only way to ask where a line actually starts
   and stops; the alternative is believing the code that wrote them. */
function segmentsOf(w){
  const d = w.document;
  const canvas = d.querySelector('.stage__canvas').getBoundingClientRect();
  /* A moveto and then any run of H and V, in whatever order they come. It
     used to be spelled out as "a V and then maybe an H", which is the one
     shape there was at the time; the elbow on the left runs the other way
     round — along first, then up — and against that pattern it did not
     parse at all, so the line was read as missing rather than as wrong. */
  return [...d.querySelectorAll('.portal-wires .wire')].map(p => {
    const t = p.getAttribute('d');
    const m = /^M([-\d.]+) ([-\d.]+)((?:\s*[HV][-\d.]+)*)$/.exec(t);
    if (!m) return null;
    let x = parseFloat(m[1]), y = parseFloat(m[2]);
    const pts = [[x, y]];
    const step = /([HV])([-\d.]+)/g;
    let c;
    while ((c = step.exec(m[3]))) {
      if (c[1] === 'H') x = parseFloat(c[2]); else y = parseFloat(c[2]);
      pts.push([x, y]);
    }
    return {
      d: t,
      pts: pts.map(([px, py]) => [px + canvas.left, py + canvas.top])
    };
  });
}
const near = (a, b, tol) => Math.abs(a - b) <= tol;
/* Does a point sit on the boundary of this box (not merely inside it)? */
function touches(pt, r, tol){
  const [x, y] = pt;
  const inX = x >= r.left - tol && x <= r.right + tol;
  const inY = y >= r.top - tol && y <= r.bottom + tol;
  if (!inX || !inY) return false;
  return near(x, r.left, tol) || near(x, r.right, tol) ||
         near(y, r.top, tol) || near(y, r.bottom, tol);
}
function inBox(pt, r, pad){
  return pt[0] >= r.left - pad && pt[0] <= r.right + pad &&
         pt[1] >= r.top - pad && pt[1] <= r.bottom + pad;
}
/* Axis-aligned segment against a box, with a little slack so a line that
   merely grazes a corner is not called a crossing. */
function segHitsBox(a, b, r, slack){
  const x0 = Math.min(a[0], b[0]) + slack, x1 = Math.max(a[0], b[0]) - slack;
  const y0 = Math.min(a[1], b[1]) + slack, y1 = Math.max(a[1], b[1]) - slack;
  return x1 >= r.left && x0 <= r.right && y1 >= r.top && y0 <= r.bottom;
}
function nodeCentres(w){
  const canvas = w.document.querySelector('.stage__canvas').getBoundingClientRect();
  return [...w.document.querySelectorAll('.portal-wires .node')].map(g => {
    const m = /translate\(([-\d.]+) ([-\d.]+)\)/.exec(g.getAttribute('transform') || '');
    return m ? [parseFloat(m[1]) + canvas.left, parseFloat(m[2]) + canvas.top] : null;
  });
}
/* A computed colour can come back as rgb(0-255) or, from color-mix(), as
   color(srgb 0-1) — read both onto the same 0-255 scale. */
function rgb(s){
  const n = (s.match(/[\d.]+/g) || []).slice(0, 3).map(Number);
  return /color\(/.test(s) ? n.map(v => Math.round(v * 255)) : n;
}

/* The word's ink, re-derived here rather than trusted from the page: the
   same font drawn into a canvas, read back column by column. It answers the
   only question that matters about this composition — for a given column,
   how high does the lettering actually reach — which is what both the
   connectors and the greeting have to clear. */
function inkReader(w){
  const sc = w.document.querySelector('.wm__script');
  const cs = w.getComputedStyle(sc);
  const text = sc.textContent;
  const r = sc.getBoundingClientRect();
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  const font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
  ctx.font = font;
  const m = ctx.measureText(text);
  const k = r.width / m.width;                       // page px per natural px
  const pad = Math.ceil(parseFloat(cs.fontSize)) + 4;
  const natLine = r.height / k;
  cv.width = Math.ceil(m.width) + pad * 2;
  cv.height = Math.ceil(natLine);
  ctx.font = font;                                   // the resize cleared it
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#fff';
  ctx.fillText(text, pad, (natLine - (m.fontBoundingBoxAscent + m.fontBoundingBoxDescent)) / 2 +
                          m.fontBoundingBoxAscent);
  const data = ctx.getImageData(0, 0, cv.width, cv.height).data;

  return function inkTopIn(pageX0, pageX1){
    const c0 = Math.max(0, Math.round((pageX0 - r.left) / k) + pad);
    const c1 = Math.min(cv.width - 1, Math.round((pageX1 - r.left) / k) + pad);
    let best = cv.height;
    for (let c = c0; c <= c1; c++) {
      for (let y = 0; y < best; y++) {
        if (data[(y * cv.width + c) * 4 + 3] > 24) { best = y; break; }
      }
    }
    return best >= cv.height ? null : r.top + best * k;
  };
}

(async function run(){
  let w = await load('index.html', 1280, 900);
  w.addEventListener('error', e => errors.push('frame: ' + e.message));
  await wait(2600);
  let d = w.document;
  const cs = el => w.getComputedStyle(el);
  const slots = [...d.querySelectorAll('.portal-slot')];
  const pills = slots.map(s => s.querySelector('.portal'));
  const notes = slots.map(s => s.querySelector('.portal__note'));
  const sc = d.querySelector('.wm__script');

  head('1 · the pills, refined');
  check('four of them, arranged', slots.length === 4 && pills.every(Boolean));
  check('label is 11px — a step under the interface label',
        pills.every(p => Math.abs(parseFloat(cs(p).fontSize) - 11) < 0.6),
        cs(pills[0]).fontSize);
  /* getComputedStyle reports the used width, and a 1x display rounds half a
     pixel back up to one — so the line is checked for being no heavier than
     a hairline, and the softening that carries the intent on those displays
     is checked separately. */
  check('border is no heavier than a hairline',
        pills.every(p => parseFloat(cs(p).borderTopWidth) <= 1),
        cs(pills[0]).borderTopWidth);
  check('and softened, so it reads lighter where half a pixel cannot',
        pills.every(p => {
          const a = (cs(p).borderTopColor.match(/[\d.]+/g) || [])[3];
          return a !== undefined && parseFloat(a) < 0.95;
        }), cs(pills[0]).borderTopColor);
  check('box is compact — 32px tall',
        pills.every(p => Math.abs(parseFloat(cs(p).height) - 32) < 1), cs(pills[0]).height);
  check('and tight across — 16px of inline padding or less',
        pills.every(p => parseFloat(cs(p).paddingLeft) <= 16.5), cs(pills[0]).paddingLeft);
  /* Lowercase now, to sit with the name they are arranged around — the mark
     is lowercase and these are the only other words in the composition. The
     tracking is what still makes them read as labels rather than as prose,
     so that half of the old check stands. */
  check('the labels still read as labels — lowercase, tracked, mono-ish',
        pills.every(p => cs(p).textTransform === 'lowercase' && parseFloat(cs(p).letterSpacing) > 0),
        cs(pills[0]).textTransform + '/' + cs(pills[0]).letterSpacing);
  /* The lowercasing is the stylesheet's, not the markup's, and that is the
     point: what a screen reader announces is the source, so the source stays
     in sentence case while only the rendering comes down. A later hand
     respelling these in the fragment would lose that for no gain. */
  check('and the source they are lowercased from is still sentence case',
        pills.every(p => /^[A-Z]/.test(p.textContent.trim())),
        pills.map(p => p.textContent.replace(/\s+/g, ' ').trim()).join(' | '));
  check('every pill still goes somewhere',
        pills.map(p => p.getAttribute('href')).join(',') === 'fun/,writing/,experiments/,about/',
        pills.map(p => p.getAttribute('href')).join(','));

  head('2 · the descriptions wait to be asked');
  check('four of them, one per pill', notes.every(Boolean) && notes.length === 4);
  check('all four are down at rest', notes.every(n => cs(n).opacity === '0'),
        notes.map(n => cs(n).opacity).join(','));
  check('they still occupy their boxes, so nothing can shift later',
        notes.every(n => n.getBoundingClientRect().height > 0),
        notes.map(n => Math.round(n.getBoundingClientRect().height)).join(','));
  check('and they are not display:none or hidden — only transparent',
        notes.every(n => cs(n).display !== 'none' && cs(n).visibility === 'visible'),
        cs(notes[0]).display + '/' + cs(notes[0]).visibility);

  head('3 · one pill at a time');
  const pillBoxes0 = pills.map(p => JSON.stringify(p.getBoundingClientRect()));
  const colours = [];
  for (let i = 0; i < 4; i++) {
    const key = pills[i].getAttribute('href').replace('/', '');
    pills[i].dispatchEvent(new w.PointerEvent('pointerenter', { pointerType: 'mouse', bubbles: true }));
    await wait(520);

    const up = notes.map(n => parseFloat(cs(n).opacity) > 0.05);
    check(key + ': its own description is up', up[i], up.join(','));
    check(key + ': and it is the only one', up.filter(Boolean).length === 1, up.join(','));
    check(key + ': its pictures came with it',
          d.querySelector('.stage').getAttribute('data-peek') === key,
          d.querySelector('.stage').getAttribute('data-peek'));
    check(key + ': the pill is marked as the one being read',
          pills[i].classList.contains('is-peeking') &&
          pills.filter(p => p.classList.contains('is-peeking')).length === 1);
    check(key + ': nothing moved — no pill shifted under the pointer',
          pills.map(p => JSON.stringify(p.getBoundingClientRect())).join('|') === pillBoxes0.join('|'));

    const c = rgb(cs(notes[i]).color);
    colours.push(c.join(','));
    check(key + ': the description is coloured, not grey',
          Math.max(...c) - Math.min(...c) >= 12, c.join(','));
    check(key + ': and light enough to read on this background',
          (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) >= 120,
          Math.round(0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]));

    pills[i].dispatchEvent(new w.PointerEvent('pointerleave', { pointerType: 'mouse', bubbles: true }));
    await wait(520);
    check(key + ': and it goes away again on leave',
          notes.every(n => parseFloat(cs(n).opacity) < 0.05),
          notes.map(n => cs(n).opacity).join(','));
  }
  check('each pill has its own colour', new Set(colours).size === 4, colours.join(' / '));

  head('4 · crossing between two pills does not flicker');
  pills[0].dispatchEvent(new w.PointerEvent('pointerenter', { pointerType: 'mouse', bubbles: true }));
  await wait(400);
  pills[0].dispatchEvent(new w.PointerEvent('pointerleave', { pointerType: 'mouse', bubbles: true }));
  pills[1].dispatchEvent(new w.PointerEvent('pointerenter', { pointerType: 'mouse', bubbles: true }));
  await wait(60);
  check('the handover does not blank the layer mid-way',
        d.querySelector('.stage').getAttribute('data-peek') === 'writing',
        d.querySelector('.stage').getAttribute('data-peek'));
  await wait(500);
  const up2 = notes.map(n => parseFloat(cs(n).opacity) > 0.05);
  check('and lands on exactly one description', up2.filter(Boolean).length === 1 && up2[1],
        up2.join(','));
  pills[1].dispatchEvent(new w.PointerEvent('pointerleave', { pointerType: 'mouse', bubbles: true }));
  await wait(520);

  head('5 · the connectors start and end on something');
  const inkTop = inkReader(w);
  const segs = segmentsOf(w).filter(Boolean);
  const nodes = nodeCentres(w).filter(Boolean);
  const pillRects = pills.map(p => p.getBoundingClientRect());
  const scRect = sc.getBoundingClientRect();
  check('four lines, four markers', segs.length === 4 && nodes.length === 4,
        segs.length + '/' + nodes.length);
  check('every line is straight or a single L',
        segs.every(s => s.pts.length === 2 || s.pts.length === 3),
        segs.map(s => s.pts.length).join(','));

  segs.forEach((s, i) => {
    const top = s.pts[s.pts.length - 1];     // the end that goes to the pill
    const tip = s.pts[0];                    // the end that goes to the letter
    const onPill = pillRects.filter(r => touches(top, r, 2));
    check('line ' + i + ' ends on a pill edge', onPill.length === 1,
          s.d + ' → ' + onPill.length + ' pills');
    /* Two ways for a line to meet its letter, and they are checked
       differently because they are different claims.

       A drop comes down from over the top: "stops just above the ink that is
       actually under it". Not "inside the word's box" — the box is the sum
       of the advances, and this hand leans its ink well past it.

       The elbow comes in from the side at the middle of the letter, so there
       is nothing under it to stop above. What has to be true there is that it
       starts off the ink and not on it, and that it starts below the top of
       the ink rather than above it — which is what makes it the letter's
       flank rather than another drop that missed. */
    const sideways = s.pts.length > 1 &&
                     Math.abs(s.pts[1][1] - tip[1]) < 0.5 &&
                     Math.abs(s.pts[1][0] - tip[0]) > 0.5;
    if (sideways) {
      const beside = inkTop(tip[0] + 4, tip[0] + 24);   // just into the letter
      const under = inkTop(tip[0] - 10, tip[0] - 2);    // just off it
      check('line ' + i + ' leaves its letter from the flank, not over the top',
            beside !== null && tip[1] > beside + 6,
            beside === null ? 'no ink beside ' + Math.round(tip[0])
                            : 'start is ' + Math.round(tip[1] - beside) + 'px below the ink top');
      check('line ' + i + ' starts clear of the ink rather than on it',
            under === null, under === null ? '' : 'ink at ' + Math.round(under));
    } else {
      const ink = inkTop(tip[0] - 3, tip[0] + 3);
      check('line ' + i + ' stops just above the ink of its letter',
            ink !== null && (ink - tip[1]) >= 0 && (ink - tip[1]) <= 16,
            ink === null ? 'no ink under ' + Math.round(tip[0])
                         : 'gap ' + Math.round(ink - tip[1]) + 'px');
    }
    check('line ' + i + ' has a marker on that end',
          nodes.some(n => near(n[0], tip[0], 1.5) && near(n[1], tip[1], 1.5)),
          Math.round(tip[0]) + ',' + Math.round(tip[1]));
  });

  head('6 · and cross nothing on the way');
  segs.forEach((s, i) => {
    const mine = pillRects.filter(r => touches(s.pts[s.pts.length - 1], r, 2))[0];
    for (let k = 0; k < s.pts.length - 1; k++) {
      const a = s.pts[k], b = s.pts[k + 1];
      pillRects.forEach((r, j) => {
        if (r === mine) return;
        check('line ' + i + ' clear of pill ' + j, !segHitsBox(a, b, r, 1.5),
              s.d);
      });
    }
  });
  const greetR = d.querySelector('.wm__greet').getBoundingClientRect();
  segs.forEach((s, i) => {
    let hit = false;
    for (let k = 0; k < s.pts.length - 1; k++) {
      if (segHitsBox(s.pts[k], s.pts[k + 1], greetR, 1.5)) hit = true;
    }
    check('line ' + i + ' clear of the greeting', !hit, s.d);
  });

  head('7 · the greeting sits with the name');
  /* Measured against the ink under the greeting, not against the word's
     box: the greeting is deliberately inside that box now — that is the
     whole change — and the only thing that would be wrong is it touching a
     letter. */
  const underGreet = inkTop(greetR.left - 4, greetR.right + 4);
  check('it is tucked into the name, not parked above it',
        underGreet !== null && (underGreet - greetR.bottom) < 60,
        underGreet === null ? 'no ink under the greeting'
                            : Math.round(underGreet - greetR.bottom) + 'px of air below it');
  check('without landing on the lettering',
        underGreet !== null && underGreet > greetR.bottom,
        underGreet === null ? 'no ink' :
        'ink at ' + Math.round(underGreet) + ', greeting ends at ' + Math.round(greetR.bottom));
  check('and it is still centred on the name',
        Math.abs((greetR.left + greetR.width / 2) - (scRect.left + scRect.width / 2)) < 2,
        Math.round((greetR.left + greetR.width / 2) - (scRect.left + scRect.width / 2)));
  check('no horizontal overflow at 1280',
        d.documentElement.scrollWidth <= d.documentElement.clientWidth,
        overflowing(w));

  head('7b · the composition sits level in the canvas');
  const canvasR = d.querySelector('.stage__canvas').getBoundingClientRect();
  const topPill = Math.min(...slots.map(x => x.getBoundingClientRect().top));
  const tailR = d.querySelector('.stage__years').getBoundingClientRect();
  const above = topPill - canvasR.top;
  const below = canvasR.bottom - tailR.bottom;
  check('the air above the pills matches the air under the last line',
        Math.abs(above - below) <= 12,
        Math.round(above) + 'px above / ' + Math.round(below) + 'px below');
  check('and the top tier still clears the navigation', above >= 10, Math.round(above));
  check('the timeline below is untouched by it',
        w.getComputedStyle(d.querySelector('.arc')).visibility === 'visible' &&
        d.querySelector('.arc').getBoundingClientRect().top >= canvasR.bottom - 1,
        Math.round(d.querySelector('.arc').getBoundingClientRect().top) + ' vs ' + Math.round(canvasR.bottom));

  head('7c · the grid runs behind the header');
  const navWrap = d.querySelector('.nav-wrap');
  const navGrid = w.getComputedStyle(navWrap, '::before');
  check('the header carries the same squares',
        /linear-gradient/.test(navGrid.backgroundImage), navGrid.backgroundImage.slice(0, 48));
  check('pinned to the viewport, so the cells line up with the page grid',
        navGrid.backgroundAttachment === 'fixed', navGrid.backgroundAttachment);
  check('same cell size as the layer below',
        navGrid.backgroundSize === w.getComputedStyle(d.body, '::before').backgroundSize,
        navGrid.backgroundSize + ' vs ' + w.getComputedStyle(d.body, '::before').backgroundSize);
  check('and it is actually visible', parseFloat(navGrid.opacity) > 0, navGrid.opacity);
  const deco = parseFloat(w.getComputedStyle(d.documentElement).getPropertyValue('--deco'));
  const gridDeco = parseFloat(w.getComputedStyle(d.body, '::before').opacity);
  check('the grid is a fifth lighter than the rest of the decorative layer',
        Math.abs(gridDeco - deco * 0.8) < 0.02, gridDeco + ' vs deco ' + deco);
  check('the Grid control still reaches it',
        (() => { w.APTokens.set('grid', 'off');
                 const off = parseFloat(w.getComputedStyle(navWrap, '::before').opacity);
                 w.APTokens.set('grid', 'classic');
                 return off === 0; })(),
        'off state');

  head('8 · phone 375 — the flat row takes over');
  w = await load('index.html', 375, 780);
  await wait(2600);
  d = w.document;
  check('the arranged pills are not the visible row',
        w.getComputedStyle(d.querySelector('.portals')).display === 'none',
        w.getComputedStyle(d.querySelector('.portals')).display);
  check('and no connectors are drawn down here',
        d.querySelectorAll('.portal-wires .wire').length === 0,
        d.querySelectorAll('.portal-wires .wire').length);
  check('the flat row is compact too',
        Math.abs(parseFloat(w.getComputedStyle(d.querySelector('.portals-flat .portal')).height) - 32) < 1,
        w.getComputedStyle(d.querySelector('.portals-flat .portal')).height);
  check('the greeting is still clear of the lettering',
        d.querySelector('.wm__greet').getBoundingClientRect().bottom <=
        d.querySelector('.wm__script').getBoundingClientRect().bottom);
  check('no horizontal overflow at 375',
        d.documentElement.scrollWidth <= d.documentElement.clientWidth,
        d.documentElement.scrollWidth + ' > ' + d.documentElement.clientWidth + '  ' + overflowing(w));

  head('9 · narrow phone 320');
  w = await load('index.html', 320, 700);
  await wait(2400);
  d = w.document;
  check('no horizontal overflow at 320',
        d.documentElement.scrollWidth <= d.documentElement.clientWidth,
        d.documentElement.scrollWidth + ' > ' + d.documentElement.clientWidth + '  ' + overflowing(w));
  check('the name still fits', d.querySelector('.wm__script').getBoundingClientRect().right <=
        d.documentElement.clientWidth - 4);

  head('10 · console');
  check('no page errors', errors.length === 0, errors.join(' // '));

  flush();
  post();
})().catch(e => {
  lines.push('<span class="bad">  THREW</span> ' + e.message + '\n' + e.stack);
  fail++;
  flush();
  post();
});
</script>
