<!doctype html>
<meta charset="utf-8">
<title>verify name</title>
<style>body{background:#111;color:#ddd;font:13px/1.5 monospace;padding:12px}
.ok{color:#8ad67a}.bad{color:#ff7a6b}.hd{color:#e0b07a;margin-top:10px}
iframe{border:1px solid #333}</style>
<pre id="out">running…</pre>
<iframe id="f" style="width:1280px;height:900px"></iframe>
<script>
/* A throwaway harness for the wordmark. It drives the real homepage in an
   iframe and prints a report, so behaviour is checked rather than eyeballed.
   Not shipped.

   What it is here to hold down: the name is the cursive word, permanently.
   Nothing reveals it, nothing takes it away, and nothing on this page
   answers a pointer landing on it. The six capitals behind it are still the
   real text and still the box everything else is measured against — so the
   interesting failures are "the script needed asking for", "the capitals
   went away and took the geometry with them", and "the bigger script pushed
   something off screen". */
const lines = [];
let pass = 0, fail = 0;
function head(t){ lines.push('\n<span class="hd">'+t+'</span>'); }
function check(name, cond, extra){
  if (cond) { pass++; lines.push('<span class="ok">  PASS</span> '+name); }
  else { fail++; lines.push('<span class="bad">  FAIL</span> '+name+(extra!==undefined?'  ['+extra+']':'')); }
}
function flush(){
  document.getElementById('out').innerHTML =
    lines.join('\n') + '\n\n<span class="hd">RESULT</span> pass='+pass+' fail='+fail+
    (fail? ' <span class="bad">***FAILURES***</span>' : ' <span class="ok">ALL GREEN</span>');
}
const errors = [];
const wait = ms => new Promise(r => setTimeout(r, ms));
const f = document.getElementById('f');

function post(){
  const txt = lines.join('\n').replace(/<[^>]+>/g, '') +
    '\n\nRESULT pass=' + pass + ' fail=' + fail + (fail ? '  ***FAILURES***' : '  ALL GREEN');
  navigator.sendBeacon('/report', txt) || fetch('/report', { method:'POST', body: txt });
}

/* Which boxes actually stick out of the document, so an overflow failure
   names its cause instead of just its width. */
function overflowing(w){
  const d = w.document, lim = d.documentElement.clientWidth, out = [];
  d.querySelectorAll('*').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.width === 0 && r.height === 0) return;
    if (r.right > lim + 0.5 || r.left < -0.5) {
      out.push(el.tagName.toLowerCase() +
        (el.className && typeof el.className === 'string' ? '.' + el.className.trim().split(/\s+/).join('.') : '') +
        ' [' + Math.round(r.left) + '→' + Math.round(r.right) + ']');
    }
  });
  return out.slice(0, 8).join('  ');
}

/* Resolving on the iframe's load event is not enough: it fires for the
   initial about:blank as well, and on a cold start that hands the suite a
   document whose markup is parsed but whose scripts have not run — which
   reads back as "the wires were never drawn" and "there is no token store",
   neither of which is true of the page. So wait for the real document with
   the store actually on it.

   Deliberately not readyState === 'complete': an iframe running the intro
   under headless can sit at 'interactive' for a long time with a subresource
   still outstanding, and every deferred script has already run by then. */
function load(url, w, h){
  f.style.width = w + 'px';
  f.style.height = h + 'px';
  return new Promise((res, rej) => {
    f.src = url;
    const t0 = Date.now();
    const poll = setInterval(() => {
      let cw = null;
      try {
        cw = f.contentWindow;
        if (cw && cw.location.href.indexOf(url) !== -1 &&
            cw.document.readyState !== 'loading' &&
            cw.APTokens && cw.document.querySelector('.wm__script')) {
          clearInterval(poll); res(cw); return;
        }
      } catch (e) { /* cross-document access while navigating */ }
      if (Date.now() - t0 > 20000) {
        clearInterval(poll);
        let why = 'no contentWindow';
        try {
          const d = cw && cw.document;
          why = 'href=' + (cw && cw.location.href) +
                ' ready=' + (d && d.readyState) +
                ' APTokens=' + (cw && typeof cw.APTokens) +
                ' scripts=' + (d ? d.querySelectorAll('script').length : '-') +
                ' script-layer=' + (d ? !!d.querySelector('.wm__script') : '-') +
                ' body=' + (d && d.body ? d.body.children.length : '-');
        } catch (e) { why = 'threw: ' + e.message; }
        rej(new Error('timed out loading ' + url + ' — ' + why));
      }
    }, 100);
  });
}

/* The whole appearance of both layers, so "nothing answers a pointer" can be
   asserted in one comparison rather than property by property. */
function face(w){
  const d = w.document;
  const sc = d.querySelector('.wm__script');
  const l = d.querySelectorAll('.wm__l');
  const cs = el => w.getComputedStyle(el);
  const box = el => { const r = el.getBoundingClientRect();
                      return [r.left, r.top, r.width, r.height].map(n => n.toFixed(2)).join(','); };
  return [cs(sc).opacity, cs(sc).fontFamily, cs(sc).fontSize, cs(sc).fontWeight, cs(sc).fontStyle,
          cs(sc).color, cs(sc).transform, box(sc),
          cs(l[0]).opacity, cs(l[0]).color, cs(l[0]).letterSpacing, box(l[0]), box(l[3]),
          d.querySelector('.wm').className].join(' | ');
}

/* Centre-to-centre, which is what "the name has not moved" means for a layer
   that is positioned rather than laid out. */
function offCentre(w, a, b){
  const ra = w.document.querySelector(a).getBoundingClientRect();
  const rb = w.document.querySelector(b).getBoundingClientRect();
  return [Math.abs((ra.left + ra.width / 2) - (rb.left + rb.width / 2)),
          Math.abs((ra.top + ra.height / 2) - (rb.top + rb.height / 2))];
}

async function suite(w, label, width){
  const d = w.document;
  const cs = el => w.getComputedStyle(el);
  const wm = d.querySelector('.wm');
  const sc = d.querySelector('.wm__script');
  const L = [...d.querySelectorAll('.wm__l')];

  head(label + ' · the capitals: real text, and nothing to look at');
  check('six letters, still the real text',
        L.length === 6 && L.map(x => x.textContent).join('') === 'ARUSHI',
        L.map(x => x.textContent).join(''));
  check('the heading element is the name', d.querySelector('h1.wm') === wm);
  check('invisible', L.every(x => cs(x).opacity === '0'), cs(L[0]).opacity);
  check('but not hidden — a screen reader is still given ARUSHI',
        L.every(x => cs(x).visibility === 'visible' && cs(x).display !== 'none'),
        cs(L[0]).visibility + '/' + cs(L[0]).display);
  check('they still occupy a box, which is what the page measures',
        L.every(x => x.getBoundingClientRect().width > 0),
        L.map(x => Math.round(x.getBoundingClientRect().width)).join(','));
  check('no longer focus stops', L.every(x => x.tabIndex === -1), L.map(x => x.tabIndex).join(','));
  check('and no longer advertising a pointer', L.every(x => cs(x).cursor !== 'pointer'), cs(L[0]).cursor);

  head(label + ' · the cursive word: the name, permanently');
  check('it reads arushi', sc.textContent === 'arushi', JSON.stringify(sc.textContent));
  check('lowercase, first letter included', sc.textContent === sc.textContent.toLowerCase());
  check('decorative, so the name is not announced twice',
        sc.getAttribute('aria-hidden') === 'true');
  check('fully opaque with nothing asked of the visitor', cs(sc).opacity === '1', cs(sc).opacity);
  check('out of flow, so its size cannot move anything',
        cs(sc).position === 'absolute', cs(sc).position);
  check('set in a script face',
        /snell|chancery|script|handwriting|cursive/i.test(cs(sc).fontFamily), cs(sc).fontFamily);
  check('a step heavier than the regular cut', parseInt(cs(sc).fontWeight, 10) >= 600, cs(sc).fontWeight);
  const ratio = parseFloat(cs(sc).fontSize) / parseFloat(cs(wm).fontSize);
  check('ten per cent up on the 1.1em it was drawn at', Math.abs(ratio - 1.21) < 0.015, ratio.toFixed(4));
  check('the capitals keep their own size — the budget below is untouched',
        Math.abs(parseFloat(cs(wm).fontSize) - parseFloat(cs(L[0]).fontSize)) < 0.01,
        cs(wm).fontSize + ' vs ' + cs(L[0]).fontSize);

  head(label + ' · position and alignment');
  const [dx, dy] = offCentre(w, '.wm__script', '.wm');
  check('the word sits centred on the row it replaces — the intro released it',
        dx < 1 && dy < 1, dx.toFixed(2) + ' / ' + dy.toFixed(2));
  check('the row is centred in the canvas',
        offCentre(w, '.wm', '.stage__canvas')[0] < 1, offCentre(w, '.wm', '.stage__canvas')[0].toFixed(2));
  /* Not merely inside the viewport — clear of it. A script that reaches the
     edge reads as a word that did not fit, and the swash on the last letter
     carries ink past the box this measures. */
  const scR = sc.getBoundingClientRect(), lim = d.documentElement.clientWidth;
  check('the name is clear of both edges, script and all',
        scR.left >= 6 && scR.right <= lim - 6,
        Math.round(scR.left) + '–' + Math.round(scR.right) + ' of ' + lim +
        ' (margins ' + Math.round(scR.left) + '/' + Math.round(lim - scR.right) + ')');
  check('and it is narrower than the row it sits on, so the capitals stay the budget',
        scR.width <= wm.getBoundingClientRect().width + 1,
        Math.round(scR.width) + ' vs ' + Math.round(wm.getBoundingClientRect().width));
  check('no horizontal overflow on the page',
        d.documentElement.scrollWidth <= d.documentElement.clientWidth,
        d.documentElement.scrollWidth + ' > ' + d.documentElement.clientWidth + '  ' + overflowing(w));

  head(label + ' · nothing answers a pointer');
  const face0 = face(w);
  L[2].dispatchEvent(new w.MouseEvent('mouseenter', { bubbles: true }));
  L[2].dispatchEvent(new w.MouseEvent('mouseover', { bubbles: true }));
  wm.dispatchEvent(new w.MouseEvent('mouseenter', { bubbles: true }));
  await wait(500);
  check('hovering a letter changes nothing at all', face(w) === face0, face(w) + '  vs  ' + face0);
  check('no inline hue is written', L[2].style.getPropertyValue('--h') === '');
  L[2].dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
  await wait(500);
  check('a tap changes nothing either', face(w) === face0, face(w) + '  vs  ' + face0);
  check('and leaves no state class behind', !wm.className.includes('is-script'), wm.className);
  L[2].focus();
  await wait(400);
  check('focus cannot land on a letter', d.activeElement !== L[2],
        d.activeElement && (d.activeElement.className || d.activeElement.tagName));
  check('focus changes nothing', face(w) === face0);
  L[2].dispatchEvent(new w.MouseEvent('mouseleave', { bubbles: true }));
  wm.dispatchEvent(new w.MouseEvent('mouseleave', { bubbles: true }));
  await wait(500);
  check('and leaving changes nothing back', face(w) === face0, face(w) + '  vs  ' + face0);

  head(label + ' · the hint line is gone, with its space');
  check('no .wm__hint in the markup', !d.querySelector('.wm__hint'));
  check('nothing is left standing in its place',
        [...d.querySelector('.wm-wrap').children].map(c => c.className.split(' ')[0]).join(',') ===
        'wm__greet,wm-frame',
        [...d.querySelector('.wm-wrap').children].map(c => c.className).join(' / '));
  check('no line of type asks to be hovered',
        !/hover/i.test(d.querySelector('.wm-wrap').textContent),
        d.querySelector('.wm-wrap').textContent.trim().slice(0, 60));
  check('the greeting above the name is untouched',
        d.querySelector('.wm__greet') && cs(d.querySelector('.wm__greet')).visibility === 'visible');

  return { wmBox: wm.getBoundingClientRect(), width: width };
}

(async function run(){
  // ---------------------------------------------------------------- desktop
  let w = await load('index.html', 1280, 900);
  w.addEventListener('error', e => errors.push('frame: ' + e.message));
  await wait(2600);                             // let the intro finish
  const deskWm = (await suite(w, '1 · desktop 1280', 1280)).wmBox;

  head('2 · desktop — the capitals are still doing their other two jobs');
  let d = w.document;
  check('four connector wires are drawn, anchored to the letters',
        d.querySelectorAll('.portal-wires .wire').length === 4,
        d.querySelectorAll('.portal-wires .wire').length);
  check('their endpoint markers landed too', d.querySelectorAll('.portal-wires .node').length === 4,
        d.querySelectorAll('.portal-wires .node').length);
  const lede0 = d.querySelector('.stage__lede').getBoundingClientRect().top;
  const hBr = d.querySelector('.sel__h--br');
  for (let i = 0; i < 6; i++) hBr.dispatchEvent(new w.KeyboardEvent('keydown', { key:'ArrowUp', bubbles:true }));
  await wait(600);
  check('the Type tool still scales the mark', w.APTokens.get().scale > 1, w.APTokens.get().scale);
  check('and scaling it still shifts nothing below',
        Math.abs(d.querySelector('.stage__lede').getBoundingClientRect().top - lede0) < 0.5,
        'moved ' + (d.querySelector('.stage__lede').getBoundingClientRect().top - lede0).toFixed(2) + 'px');
  check('the word scales with the row it sits on',
        offCentre(w, '.wm__script', '.wm')[0] < 1.5, offCentre(w, '.wm__script', '.wm')[0].toFixed(2));
  hBr.dispatchEvent(new w.KeyboardEvent('keydown', { key:'Home', bubbles:true }));
  await wait(600);
  check('Home returns it to 1×', Math.abs(w.APTokens.get().scale - 1) < 0.001, w.APTokens.get().scale);
  check('and the row is back to the box it started in',
        Math.abs(d.querySelector('.wm').getBoundingClientRect().width - deskWm.width) < 0.5,
        d.querySelector('.wm').getBoundingClientRect().width + ' vs ' + deskWm.width);

  // ------------------------------------------------------------------ phone
  w = await load('index.html', 375, 780);
  await wait(2600);
  await suite(w, '3 · phone 375', 375);

  // --------------------------------------------------------- narrow phone
  w = await load('index.html', 320, 700);
  await wait(2400);
  await suite(w, '4 · narrow phone 320', 320);

  head('5 · console');
  check('no page errors', errors.length === 0, errors.join(' // '));

  flush();
  post();
})().catch(e => {
  lines.push('<span class="bad">  THREW</span> ' + e.message + '\n' + e.stack);
  fail++;
  flush();
  post();
});
</script>
