<!doctype html><meta charset="utf-8">
<style>#f{position:fixed;left:0;top:0;border:0;z-index:0}
#out{position:absolute;inset:0;z-index:5;background:rgba(255,255,255,.97);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;padding:10px;overflow:auto}</style>
<iframe id="f"></iframe>
<img src="http://127.0.0.1:8002/slow?s=110" alt="" style="position:fixed;left:-50px;top:-50px;width:1px">
<pre id="out">running…</pre>
<script>
const q=new URLSearchParams(location.search);
const W=Number(q.get('w')||1440), H=Number(q.get('h')||900);
const URLS=(q.get('u')||'/designops/framework/').split(',');
const L=[]; let bad=0;
const ok=(c,m)=>{L.push((c?'  PASS  ':'  FAIL  ')+m); if(!c)bad++;};
const near=(a,b,t)=>Math.abs(a-b)<=t;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const f=document.getElementById('f'); f.style.width=W+'px'; f.style.height=H+'px';
const load=u=>new Promise(r=>{ f.onload=()=>f.contentWindow.document.fonts.ready.then(()=>setTimeout(r,350)); f.src=u; });

(async()=>{
 try{
  for (const u of URLS){
    await load(u);
    const w=f.contentWindow, d=f.contentDocument, de=d.documentElement;
    de.style.scrollBehavior='auto';
    w.scrollTo(600,0); await wait(120); const sideAtLoad=w.scrollX; w.scrollTo(0,0); await wait(60);
    const railIn=d.querySelector('.case__rail-in');
    if(!railIn){ L.push('### '+u+'   NO CASE RAIL'); bad++; continue; }
    const links=[...d.querySelectorAll('[data-case-link]')];
    const want=parseFloat(w.getComputedStyle(d.getElementById(links[0].dataset.caseLink)).scrollMarginTop)||104;
    L.push('### '+u+'   '+links.length+' sections · doc '+de.scrollHeight+'px · grid '+
           w.getComputedStyle(de).getPropertyValue('--grid-deco').trim());

    /* Walk the page once so every lazy image is loaded before anything is
       measured — an image landing mid-test moves the section under it and
       looks like an anchor-offset bug. */
    for (let y=0; y<de.scrollHeight; y+=Math.round(H*0.8)){ de.scrollTop=y; await wait(40); }
    de.scrollTop=0; await wait(300);

    /* Which box actually sticks changes with the layout. On a wide screen the
       rail's inner column is the sticky one, pinned at --case-top. Below 900px
       the rail becomes a horizontal strip pinned at --nav-height, and its inner
       column goes static. Sections clear nav *and* strip, so their
       scroll-margin-top is deliberately larger than where the rail sits — it is
       the wrong number to measure the rail against. Ask the sticky box itself. */
    const railEl = d.querySelector('.case__rail');
    const stick = w.getComputedStyle(railEl).position==='sticky' ? railEl : railIn;
    const stickWant = parseFloat(w.getComputedStyle(stick).top)||0;

    // sticky
    const caseTopY = de.scrollTop + d.querySelector('.case').getBoundingClientRect().top;
    let stuck=0, tops=[];
    for (const at of ['start','middle','end']){
      const max=de.scrollHeight-H-10;   // re-read: the page may have changed height
      const caseEl=d.querySelector('.case');
      const caseBottom = de.scrollTop + caseEl.getBoundingClientRect().bottom;
      const y = at==='start' ? Math.min(caseTopY+400, max)
              : at==='middle' ? Math.round((caseTopY+max)/2)
              : Math.min(max, Math.round(caseBottom - H));   // last full view of the case
      de.scrollTop=Math.round(y); await wait(140);
      const t=stick.getBoundingClientRect().top; tops.push(at+' '+t.toFixed(0));
      if(near(t,stickWant,3)) stuck++;
    }
    ok(stuck===3,'rail sticks once the case starts and stays ('+stuck+'/3 · want '+stickWant+' · '+tops.join(', ')+')');

    // anchors + active
    let good=0, offs=[];
    for (const a of links){
      const id=a.dataset.caseLink, el=d.getElementById(id);
      de.scrollTop=0; await wait(80);
      a.click();                      // the real interaction, not scrollIntoView
      await wait(Number(q.get('settle')||750));   // let the scroll land
      const top=el.getBoundingClientRect().top;
      const edge=de.scrollTop>=de.scrollHeight-H-2 || de.scrollTop<=1;
      de.scrollTop+=40; w.dispatchEvent(new Event('scroll')); await wait(200);
      const on=d.querySelector('.case__link.is-on');
      const hit=(near(top,want,2)||edge) && (on&&on.dataset.caseLink===id||edge);
      if(hit) good++; else offs.push(id+'@'+top.toFixed(0)+'→'+(on?on.dataset.caseLink:'none'));
      }
    ok(good===links.length,'every section jumps clear of the nav and lights the rail ('+good+'/'+links.length+
       (offs.length?'  misses: '+offs.join(' '):'')+')');

    // progress
    de.scrollTop=0; w.dispatchEvent(new Event('scroll')); await wait(220);
    const fill=d.querySelector('.case__progress-fill');
    const p0=parseFloat(w.getComputedStyle(fill).getPropertyValue('--case-progress'));
    de.scrollTop=de.scrollHeight; w.dispatchEvent(new Event('scroll')); await wait(260);
    const p1=parseFloat(w.getComputedStyle(fill).getPropertyValue('--case-progress'));
    ok(p0<0.05&&p1>0.95,'progress runs 0 → 1 ('+p0.toFixed(2)+' → '+p1.toFixed(2)+')');

    // layout
    de.scrollTop=0; w.scrollTo(600,0); await wait(140);
    const sideways=w.scrollX; w.scrollTo(0,0); await wait(60);
    ok(sideways===0 && sideAtLoad===0,'page cannot be dragged sideways (on arrival '+sideAtLoad+', after reading '+sideways+
       '; scrollWidth reports '+de.scrollWidth+', which clipped overflow still inflates)');
    const rail=d.querySelector('.case__rail').getBoundingClientRect();
    const main=d.querySelector('.case__main').getBoundingClientRect();
    ok(W>900? rail.right<=main.left+1 : true,'rail and column never overlap');
    const over=[...d.querySelectorAll('.case__main .section')].filter(s=>s.getBoundingClientRect().width>main.width+2);
    ok(over.length===0,'no section overflows the reading column ('+over.length+' wide)');
    L.push('');
  }
  out.textContent=L.join('\n')+'\n'+(bad?'*** '+bad+' FAILED ***':'ALL PAGES PASSED');
 }catch(e){ out.textContent=L.join('\n')+'\nTHREW '+e.message+'\n'+e.stack; }
})();
</script>
